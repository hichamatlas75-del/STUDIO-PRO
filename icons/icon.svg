<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242834" />
      <stop offset="60%" stop-color="#14161d" />
      <stop offset="100%" stop-color="#0a0b0f" />
    </radialGradient>

    <!-- Metallic Luxury Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="25%" stop-color="#e5c158" />
      <stop offset="50%" stop-color="#c59828" />
      <stop offset="75%" stop-color="#f3d878" />
      <stop offset="100%" stop-color="#8c6414" />
    </linearGradient>

    <!-- Dark Gold for Depth -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8aa38" />
      <stop offset="100%" stop-color="#704e0b" />
    </linearGradient>

    <!-- Crimson Ruby Gradient -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Paper Texture Left/Right Pages -->
    <linearGradient id="pageLeft" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e3ded4" />
      <stop offset="12%" stop-color="#f5f2eb" />
      <stop offset="100%" stop-color="#fdfcf8" />
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e3ded4" />
      <stop offset="12%" stop-color="#f7f4ee" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#e5c158" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Squircle Shield -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadowHeavy)" />

  <!-- Inner Delicate Filigree Border -->
  <rect x="34" y="34" width="444" height="444" rx="96" ry="96" fill="none" stroke="url(#goldDark)" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Corner Flourishes -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <circle cx="48" cy="48" r="4" />
    <circle cx="464" cy="48" r="4" />
    <circle cx="48" cy="464" r="4" />
    <circle cx="464" cy="464" r="4" />
    <path d="M 68 44 L 44 44 L 44 68" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 444 44 L 468 44 L 468 68" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 68 468 L 44 468 L 44 444" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M 444 468 L 468 468 L 468 444" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  </g>

  <!-- Crown of the Chef & Stars (Top Emblem) -->
  <g transform="translate(0, -6)" filter="url(#glowGold)">
    <!-- 5-Point Crown -->
    <path d="M 216 114 L 230 138 L 256 100 L 282 138 L 296 114 L 302 152 L 210 152 Z" fill="url(#goldGrad)" />
    <!-- Crown Jewels / Dots -->
    <circle cx="216" cy="110" r="4" fill="#ffffff" />
    <circle cx="256" cy="94" r="5" fill="#ffffff" />
    <circle cx="296" cy="110" r="4" fill="#ffffff" />
    <!-- Center Jewel (Ruby) -->
    <polygon points="256,128 261,136 256,144 251,136" fill="url(#rubyGrad)" />
  </g>

  <!-- Menu Book 3D Shadow -->
  <g filter="url(#shadowHeavy)">
    <!-- Leather Cover Backing -->
    <path d="M 88 174 C 110 170 190 166 256 176 C 322 166 402 170 424 174 L 428 382 C 404 376 322 372 256 384 C 190 372 108 376 84 382 Z" fill="#1e1814" stroke="url(#goldGrad)" stroke-width="3.5" />

    <!-- Left Page -->
    <path d="M 96 182 C 120 178 190 174 254 182 L 254 374 C 190 366 120 370 96 376 Z" fill="url(#pageLeft)" />

    <!-- Right Page -->
    <path d="M 258 182 C 322 174 392 178 416 182 L 416 376 C 392 370 322 366 258 374 Z" fill="url(#pageRight)" />

    <!-- Central Spine Shadow -->
    <path d="M 252 180 L 260 180 L 260 376 L 252 376 Z" fill="#000000" opacity="0.25" />
    <line x1="256" y1="178" x2="256" y2="378" stroke="url(#goldDark)" stroke-width="2" />
  </g>

  <!-- Left Page Content: Elegant Menu Layout (Editorial PAO) -->
  <g opacity="0.92">
    <!-- Section Title -->
    <rect x="122" y="206" width="76" height="8" rx="2" fill="url(#goldDark)" />
    <!-- Small star or emblem -->
    <polygon points="112,210 114,206 116,210 119,210 116,212 118,215 114,213 111,215 112,212 109,210" fill="url(#goldGrad)" />

    <!-- Dish Row 1 -->
    <rect x="110" y="226" width="68" height="5" rx="1.5" fill="#2d3748" />
    <line x1="182" y1="230" x2="224" y2="230" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
    <rect x="228" y="226" width="18" height="5" rx="1.5" fill="url(#goldDark)" />
    <rect x="110" y="235" width="94" height="3" rx="1" fill="#718096" opacity="0.75" />

    <!-- Dish Row 2 -->
    <rect x="110" y="248" width="60" height="5" rx="1.5" fill="#2d3748" />
    <line x1="174" y1="252" x2="224" y2="252" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
    <rect x="228" y="248" width="18" height="5" rx="1.5" fill="url(#goldDark)" />
    <rect x="110" y="257" width="88" height="3" rx="1" fill="#718096" opacity="0.75" />

    <!-- Dish Row 3 (With chef badge) -->
    <circle cx="114" cy="272" r="3" fill="url(#rubyGrad)" />
    <rect x="122" y="270" width="54" height="5" rx="1.5" fill="#2d3748" />
    <line x1="180" y1="274" x2="224" y2="274" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
    <rect x="228" y="270" width="18" height="5" rx="1.5" fill="url(#goldDark)" />
    <rect x="110" y="279" width="102" height="3" rx="1" fill="#718096" opacity="0.75" />

    <!-- Dish Row 4 -->
    <rect x="110" y="292" width="65" height="5" rx="1.5" fill="#2d3748" />
    <line x1="179" y1="296" x2="224" y2="296" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
    <rect x="228" y="292" width="18" height="5" rx="1.5" fill="url(#goldDark)" />
    <rect x="110" y="301" width="80" height="3" rx="1" fill="#718096" opacity="0.75" />

    <!-- Decorative Bottom Divider -->
    <line x1="124" y1="324" x2="160" y2="324" stroke="url(#goldDark)" stroke-width="1.2" />
    <polygon points="175,324 178,321 181,324 178,327" fill="url(#goldGrad)" />
    <line x1="196" y1="324" x2="232" y2="324" stroke="url(#goldDark)" stroke-width="1.2" />

    <!-- Page Number -->
    <text x="178" y="348" font-family="'Cinzel', 'Playfair Display', serif" font-size="9" font-weight="bold" fill="url(#goldDark)" text-anchor="middle">I</text>
  </g>

  <!-- Right Page Content: Gourmet Photo Frame & Signature Specials -->
  <g opacity="0.94">
    <!-- Gourmet Photo Frame with Gold Rim -->
    <rect x="278" y="206" width="124" height="74" rx="6" fill="#1a1c23" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Dish Photo representation inside frame -->
    <circle cx="340" cy="243" r="24" fill="#2a1f18" stroke="url(#goldDark)" stroke-width="1.5" />
    <!-- Cloche or dish outline -->
    <path d="M 326 248 C 326 235 354 235 354 248 Z" fill="url(#goldGrad)" opacity="0.85" />
    <circle cx="340" cy="233" r="2.5" fill="#ffffff" />
    <line x1="322" y1="250" x2="358" y2="250" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Frame Ribbon: "CHEF SPECIAL" -->
    <rect x="296" y="274" width="88" height="12" rx="3" fill="url(#rubyGrad)" stroke="#ffffff" stroke-width="0.8" />
    <text x="340" y="283" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">★ SIGNATURE DU CHEF</text>

    <!-- Dish Item below Photo -->
    <rect x="278" y="298" width="70" height="5" rx="1.5" fill="#2d3748" />
    <line x1="352" y1="302" x2="384" y2="302" stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
    <rect x="388" y="298" width="18" height="5" rx="1.5" fill="url(#goldDark)" />
    <rect x="278" y="307" width="112" height="3" rx="1" fill="#718096" opacity="0.75" />

    <!-- Page Number -->
    <text x="340" y="348" font-family="'Cinzel', 'Playfair Display', serif" font-size="9" font-weight="bold" fill="url(#goldDark)" text-anchor="middle">II</text>
  </g>

  <!-- Golden Quill / Stylus Crossing in 3D (Symbol of Creative Design & Authoring) -->
  <g transform="translate(346, 280) rotate(-35)" filter="url(#shadowHeavy)">
    <!-- Feather Nib & Body -->
    <path d="M 0 0 L 16 -120 C 18 -150 4 -180 -10 -200 C -2 -170 0 -140 -8 -110 Z" fill="url(#goldGrad)" stroke="#523907" stroke-width="1" />
    <!-- Central quill stem -->
    <line x1="0" y1="0" x2="-8" y2="-190" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    <!-- Golden metal pen nib tip -->
    <polygon points="0,0 5,22 0,34 -5,22" fill="url(#goldDark)" stroke="#ffffff" stroke-width="0.8" />
    <line x1="0" y1="22" x2="0" y2="32" stroke="#221100" stroke-width="1" />
  </g>

  <!-- Bottom Banner: "INMENU STUDIO PRO" -->
  <g transform="translate(0, 10)" filter="url(#shadowHeavy)">
    <!-- Ribbon Base Shadow -->
    <rect x="108" y="394" width="296" height="42" rx="21" fill="#0c0d12" stroke="url(#goldGrad)" stroke-width="3" />
    <!-- Inner Border Glow -->
    <rect x="114" y="400" width="284" height="30" rx="15" fill="none" stroke="url(#goldDark)" stroke-width="1" opacity="0.8" />
    <!-- InMenu Title -->
    <text x="220" y="422" font-family="'Montserrat', 'Inter', sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="2">INMENU</text>
    <!-- Gold PRO Badge Pill -->
    <rect x="306" y="404" width="76" height="22" rx="11" fill="url(#goldGrad)" />
    <text x="344" y="420" font-family="'Montserrat', sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">PRO</text>
  </g>
</svg>